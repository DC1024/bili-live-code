<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · B站直播推流码</title>
<style>
:root{--bg:#0f1115;--card:#171a20;--line:#2a2f3a;--text:#e8eaf0;--muted:#9aa3b2;--accent:#00a1d6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 500px at 50% 0,#18222b,#0f1115 60%);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{width:min(380px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-size:20px;margin:0 0 4px}
p{color:var(--muted);font-size:12px;margin:0 0 18px}
input{width:100%;background:#0e1117;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;font:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:600;color:#fff;background:var(--accent);cursor:pointer}
.error{color:#ff7b7b;font-size:12px;margin:10px 0 0}
.hint{color:var(--muted);font-size:11px;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
<h1>B站直播推流码</h1>
<p>B站直播推流码 · 输入 WebUI 密码</p>
<input name="password" type="password" placeholder="WebUI 密码" autofocus required autocomplete="current-password">
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<button type="submit">进入</button>
<div class="hint">密码在容器的 <code>/data/webui_password</code> 或部署时的 <code>.env</code> 中。此页面只用于本机/局域网管理，不要暴露到公网。</div>
</form>
</body>
</html>
